   <g id="text_1">
    <text style="fill:#315b77;font-family:Arial;font-size:5.4px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 41.750258)" x="35.716535" y="41.750258">AUDITABLE AGENT PROMPTS · PART II</text>
   </g>
   <g id="text_2">
    <text style="fill:#111c2e;font-family:Arial;font-size:13.6px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 70.516438)" x="35.716535" y="70.516438">Repository onboarding, HPC deployment and self-healing</text>
   </g>
   <g id="text_3">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 127.800266)" x="35.716535" y="127.800266">P04</text>
   </g>
   <g id="text_4">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 127.442375)" x="68.456693" y="127.442375">Repository evidence inspection</text>
   </g>
   <g id="text_5">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 149.225835)" x="35.716535" y="149.225835">SYSTEM</text>
   </g>
   <g id="text_6">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 149.348492)">Act as a computational-biology MLOps engineer. Infer one candidate registry record from repository</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 154.981835)">evidence for deterministic validation and human review.</text>
   </g>
   <g id="text_7">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 171.956859)" x="35.716535" y="171.956859">USER</text>
   </g>
   <g id="text_8">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 172.017797)">Given candidate evidence and repository context, return model name, environment hint, repository URL,</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 177.72914)">Python version, dependencies, setup commands, inference template, weight evidence, confidence and</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 183.362484)">unresolved risks. Leave unsupported commands empty.</text>
   </g>
   <g id="text_9">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 203.527725)" x="35.716535" y="203.527725">VERIFIED OUTPUT</text>
   </g>
   <g id="text_10">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 203.588663)" x="86.314961" y="203.588663">8 registry records currently persisted in data/local_registry.json</text>
   </g>
   <g id="text_11">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 217.418906)" x="35.716535" y="217.418906">SOURCE</text>
   </g>
   <g id="text_12">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 217.665781)" x="86.314961" y="217.665781">agents/model_onboarding/repository_inspector_system.md · repository_inspector_task.md</text>
   </g>
   <g id="text_13">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 290.916407)" x="35.716535" y="290.916407">P05</text>
   </g>
   <g id="text_14">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 290.558517)" x="68.456693" y="290.558517">Deterministic registry validation</text>
   </g>
   <g id="text_15">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 312.341977)" x="35.716535" y="312.341977">SYSTEM</text>
   </g>
   <g id="text_16">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 312.402915)">Treat Agent output as a proposal, not executable truth. Normalize dependencies, reject unsafe commands,</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 318.114258)">preserve authoritative repository paths and require the declared FASTA/output placeholders.</text>
   </g>
   <g id="text_17">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 335.073001)" x="35.716535" y="335.073001">USER</text>
   </g>
   <g id="text_18">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 335.133938)">Validate required fields and evidence links before writing the registry. A model name alone is</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 340.845282)">insufficient; repository, environment, inference command and weight status remain separately auditable.</text>
   </g>
   <g id="text_19">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 357.804024)" x="35.716535" y="357.804024">VERIFIED OUTPUT</text>
   </g>
   <g id="text_20">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 357.864962)" x="86.314961" y="357.864962">Registry write is separated from deployment readiness and formal benchmark admission</text>
   </g>
   <g id="text_21">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 371.695205)" x="35.716535" y="371.695205">SOURCE</text>
   </g>
   <g id="text_22">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 371.94208)" x="86.314961" y="371.94208">new_model_onboarding.py · model_resource_policy.py · data/local_registry.json</text>
   </g>
   <g id="text_23">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 454.032549)" x="35.716535" y="454.032549">P06</text>
   </g>
   <g id="text_24">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 453.766065)" x="68.456693" y="453.766065">Bounded HPC self-heal proposal</text>
   </g>
   <g id="text_25">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 475.458119)" x="35.716535" y="475.458119">SYSTEM</text>
   </g>
   <g id="text_26">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 475.519056)">Diagnose one failed environment or smoke test from registry, repository documentation and logs.</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 481.2304)">Recommend the smallest evidence-supported repair. Deterministic code filters all packages, commands and</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 486.863744)">registry updates.</text>
   </g>
   <g id="text_27">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 507.028985)" x="35.716535" y="507.028985">USER</text>
   </g>
   <g id="text_28">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 507.028985)">Return diagnosis, pip_install, conda_install, env_setup_commands, registry_updates,</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 512.662329)">remove_requirement_patterns and retry_smoke. Never propose destructive or privileged commands.</text>
   </g>
   <g id="text_29">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 529.760009)" x="35.716535" y="529.760009">VERIFIED OUTPUT</text>
   </g>
   <g id="text_30">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 529.820946)" x="86.314961" y="529.820946">42 repair artifacts preserved under data/hpc_self_heal</text>
   </g>
   <g id="text_31">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 543.65119)" x="35.716535" y="543.65119">SOURCE</text>
   </g>
   <g id="text_32">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 543.898065)" x="86.314961" y="543.898065">agents/model_execution/self_heal_system.md · self_heal_task.md · hpc_model_ops.py</text>
   </g>
   <g id="text_33">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 617.148691)" x="35.716535" y="617.148691">P07</text>
   </g>
   <g id="text_34">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 616.882207)" x="68.456693" y="616.882207">Smoke-test admission gate</text>
   </g>
   <g id="text_35">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 638.574261)" x="35.716535" y="638.574261">SYSTEM</text>
   </g>
   <g id="text_36">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 638.638323)">Only an evidence-backed, environment-specific inference command may enter the smoke test. Failed</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 644.349667)">imports, missing weights, missing databases and unsupported CLI arguments remain visible in the log.</text>
   </g>
   <g id="text_37">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 661.305284)" x="35.716535" y="661.305284">USER</text>
   </g>
   <g id="text_38">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 661.366222)">Run a mini-FASTA test, verify the output tree and prediction schema, retry only an approved bounded</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 667.077565)">repair, and write readiness only after the smoke test succeeds.</text>
   </g>
   <g id="text_39">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 684.036308)" x="35.716535" y="684.036308">VERIFIED OUTPUT</text>
   </g>
   <g id="text_40">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 684.097245)" x="86.314961" y="684.097245">8 of 8 registry entries currently carry skip_env_setup=true</text>
   </g>
   <g id="text_41">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 697.927489)" x="35.716535" y="697.927489">SOURCE</text>
   </g>
   <g id="text_42">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 698.174364)" x="86.314961" y="698.174364">hpc_model_ops.py · data/hpc_self_heal/ · data/local_registry.json</text>
   </g>
   <g id="text_43">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 35.716535, 812.875482)" x="35.716535" y="812.875482">Core clauses are faithful, space-limited renderings of the project prompts; runtime payload values are abbreviated, never substituted.</text>
   </g>
   <g id="text_44">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:end;" transform="rotate(-0, 559.559055, 812.87431)" x="559.559055" y="812.87431">02 / 05</text>
   </g>
