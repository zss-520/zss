   <g id="text_1">
    <text style="fill:#315b77;font-family:Arial;font-size:5.4px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 41.750258)" x="35.716535" y="41.750258">AUDITABLE AGENT PROMPTS · PART V</text>
   </g>
   <g id="text_2">
    <text style="fill:#111c2e;font-family:Arial;font-size:13.6px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 70.391063)" x="35.716535" y="70.391063">Top-3 ensemble analysis and research reporting</text>
   </g>
   <g id="text_3">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 127.800266)" x="35.716535" y="127.800266">P16</text>
   </g>
   <g id="text_4">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 127.442375)" x="68.456693" y="127.442375">Exhaustive three-model enumeration</text>
   </g>
   <g id="text_5">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 149.225835)" x="35.716535" y="149.225835">SYSTEM</text>
   </g>
   <g id="text_6">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 149.284429)">This selection stage is deterministic. It must reuse stored predictions, the three dataset evaluation</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 154.995773)">bundles and accepted 50-round weights without changing the metric protocol or adding model-specific</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 160.629117)">bonuses.</text>
   </g>
   <g id="text_7">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 180.796702)" x="35.716535" y="180.796702">USER</text>
   </g>
   <g id="text_8">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 180.857639)">Enumerate every unique three-model set, align samples, calculate equal-probability soft voting and</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 186.568983)">score cross-dataset performance and stability using the stored evidence.</text>
   </g>
   <g id="text_9">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 203.527725)" x="35.716535" y="203.527725">VERIFIED OUTPUT</text>
   </g>
   <g id="text_10">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 203.542569)" x="86.314961" y="203.542569">816 unique three-model combinations evaluated</text>
   </g>
   <g id="text_11">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 217.418906)" x="35.716535" y="217.418906">SOURCE</text>
   </g>
   <g id="text_12">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 217.665781)" x="86.314961" y="217.665781">ensemble_top3_selector.py · data/results_manual/ensemble_top3_combination_ranking.csv</text>
   </g>
   <g id="text_13">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 290.916407)" x="35.716535" y="290.916407">P17</text>
   </g>
   <g id="text_14">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 290.649923)" x="68.456693" y="290.649923">Complementarity recommendation</text>
   </g>
   <g id="text_15">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 312.341977)" x="35.716535" y="312.341977">SYSTEM</text>
   </g>
   <g id="text_16">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 312.402915)">Prefer combinations supported by performance, stability and complementary errors. Do not claim</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 318.114258)">leakage-free superiority while dataset independence or homology gates remain unresolved.</text>
   </g>
   <g id="text_17">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 335.073001)" x="35.716535" y="335.073001">USER</text>
   </g>
   <g id="text_18">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 335.133938)">Select one auditable trio from the complete combination ranking and persist the method, datasets,</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 340.845282)">candidate models, metrics, ranking evidence and scientific caveat.</text>
   </g>
   <g id="text_19">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 357.804024)" x="35.716535" y="357.804024">VERIFIED OUTPUT</text>
   </g>
   <g id="text_20">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 357.864962)" x="86.314961" y="357.864962">Recommended trio: C_AMPs-predict / esm-AxP-GDL / pepnet_standard</text>
   </g>
   <g id="text_21">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 371.695205)" x="35.716535" y="371.695205">SOURCE</text>
   </g>
   <g id="text_22">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 371.94208)" x="86.314961" y="371.94208">data/results_manual/ensemble_top3_selection.json</text>
   </g>
   <g id="text_23">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 454.032549)" x="35.716535" y="454.032549">P18</text>
   </g>
   <g id="text_24">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 453.674659)" x="68.456693" y="453.674659">Research Advisor synthesis</text>
   </g>
   <g id="text_25">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 475.458119)" x="35.716535" y="475.458119">SYSTEM</text>
   </g>
   <g id="text_26">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 475.519056)">Write a concise report grounded only in final weights, ranking and dataset profiles. Clearly</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 481.2304)">distinguish exploratory ranking from leakage-free formal validation. Explain Top-3, weight consensus,</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 486.945744)">score IQR and Top-3 frequency.</text>
   </g>
   <g id="text_27">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 507.028985)" x="35.716535" y="507.028985">USER</text>
   </g>
   <g id="text_28">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 507.028985)">Analyze cross-dataset generalization, model limitations, dynamic metrics, next-generation AMP model</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 512.662329)">directions, benchmark construction and experiment priorities. Missing evidence must be stated</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 518.295672)">explicitly.</text>
   </g>
   <g id="text_29">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 538.599851)" x="35.716535" y="538.599851">VERIFIED OUTPUT</text>
   </g>
   <g id="text_30">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 538.660789)" x="86.314961" y="538.660789">amp_future_directions_report_codex_agents.md generated from stored benchmark evidence</text>
   </g>
   <g id="text_31">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 552.491032)" x="35.716535" y="552.491032">SOURCE</text>
   </g>
   <g id="text_32">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 552.737907)" x="86.314961" y="552.737907">agents/weight_meeting/research_advisor.md · agents/runtime_prompts/amp_research_advisor_template.md</text>
   </g>
   <g id="text_33">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 617.148691)" x="35.716535" y="617.148691">P19</text>
   </g>
   <g id="text_34">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 616.7908)" x="68.456693" y="616.7908">Publication and audit handoff</text>
   </g>
   <g id="text_35">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 638.574261)" x="35.716535" y="638.574261">SYSTEM</text>
   </g>
   <g id="text_36">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 638.693792)">Figures are a reporting layer and cannot feed values back into ranking. Every conclusion must remain</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 644.327136)">traceable to JSON, CSV, Markdown, source code and run manifests.</text>
   </g>
   <g id="text_37">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 661.305284)" x="35.716535" y="661.305284">USER</text>
   </g>
   <g id="text_38">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 661.369347)">Export editable vector figures, high-resolution previews, source tables, figure contracts and QA notes.</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 667.00269)">Keep exploratory conclusions and external-validation requirements visible in captions and reports.</text>
   </g>
   <g id="text_39">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 684.036308)" x="35.716535" y="684.036308">VERIFIED OUTPUT</text>
   </g>
   <g id="text_40">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 684.097245)" x="86.314961" y="684.097245">SVG/PDF/PNG figures, source CSVs, reports and complete Agent audit records preserved</text>
   </g>
   <g id="text_41">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 697.927489)" x="35.716535" y="697.927489">SOURCE</text>
   </g>
   <g id="text_42">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 698.174364)" x="86.314961" y="698.174364">figures/ · data/results_manual/ · run_manifest.py · tests/</text>
   </g>
   <g id="text_43">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 35.716535, 812.875482)" x="35.716535" y="812.875482">Core clauses are faithful, space-limited renderings of the project prompts; runtime payload values are abbreviated, never substituted.</text>
   </g>
   <g id="text_44">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:end;" transform="rotate(-0, 559.559055, 812.87431)" x="559.559055" y="812.87431">05 / 05</text>
   </g>
  </g>
 </g>
