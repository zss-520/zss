   <g id="text_1">
    <text style="fill:#315b77;font-family:Arial;font-size:5.4px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 41.750258)" x="35.716535" y="41.750258">AUDITABLE AGENT PROMPTS · PART I</text>
   </g>
   <g id="text_2">
    <text style="fill:#111c2e;font-family:Arial;font-size:13.6px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 70.350688)" x="35.716535" y="70.350688">Evidence search, memory and literature consensus</text>
   </g>
   <g id="text_3">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 127.800266)" x="35.716535" y="127.800266">P00</text>
   </g>
   <g id="text_4">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 127.442375)" x="68.456693" y="127.442375">Traceable evidence compression</text>
   </g>
   <g id="text_5">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 149.225835)" x="35.716535" y="149.225835">SYSTEM</text>
   </g>
   <g id="text_6">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 149.231304)">Compress one evidence chunk into a compact, traceable JSON record. Preserve canonical model names,</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 154.884054)">aliases, paper identifiers, repositories, datasets, metrics, blocking issues, evidence level and</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 160.517398)">uncertainty. Never invent a paper, URL, dataset or code repository.</text>
   </g>
   <g id="text_7">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 180.796702)" x="35.716535" y="180.796702">USER</text>
   </g>
   <g id="text_8">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 180.80217)">Compress the supplied runtime evidence chunk. Retain PMID, PMCID, DOI, title, URL and source fields.</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 186.45892)">Return the declared JSON schema only; long source passages are excluded from the compact pool.</text>
   </g>
   <g id="text_9">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 203.527725)" x="35.716535" y="203.527725">VERIFIED OUTPUT</text>
   </g>
   <g id="text_10">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 203.542569)" x="86.314961" y="203.542569">2,365 papers; 304 evidence batches; 241 compact summaries</text>
   </g>
   <g id="text_11">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 217.418906)" x="35.716535" y="217.418906">SOURCE</text>
   </g>
   <g id="text_12">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 217.665781)" x="86.314961" y="217.665781">agents/deepseek_meeting/evidence_compressor_agent.md · deep_research_literature_agent.py:3042-3055</text>
   </g>
   <g id="text_13">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 290.916407)" x="35.716535" y="290.916407">P01</text>
   </g>
   <g id="text_14">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 290.558517)" x="68.456693" y="290.558517">Recall-oriented model and dataset Scout</text>
   </g>
   <g id="text_15">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 312.341977)" x="35.716535" y="312.341977">SYSTEM</text>
   </g>
   <g id="text_16">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 312.402915)">Build a broad deduplicated inventory from compact evidence. Merge aliases, retain candidates with</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 318.114258)">explicit blocking issues, separate all candidates from benchmark-ready and deployable models, and</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 323.825602)">classify representation and architecture.</text>
   </g>
   <g id="text_17">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 343.912843)" x="35.716535" y="343.912843">USER</text>
   </g>
   <g id="text_18">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 344.032375)">Discuss every dynamically supplied acquisition and coverage candidate as accept, reject or defer.</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 349.743718)">Compare source provenance, labels, balance, negative construction, overlap and homology. Required core</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 355.377062)">candidates must be discussed, but are not fixed winners.</text>
   </g>
   <g id="text_19">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 375.483709)" x="35.716535" y="375.483709">VERIFIED OUTPUT</text>
   </g>
   <g id="text_20">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 375.544647)" x="86.314961" y="375.544647">20-model deployment portfolio; three dataset candidates retained with decision traces</text>
   </g>
   <g id="text_21">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 389.374891)" x="35.716535" y="389.374891">SOURCE</text>
   </g>
   <g id="text_22">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 389.621766)" x="86.314961" y="389.621766">agents/deepseek_meeting/model_dataset_agent.md · deep_research_literature_agent.py:3322-3349</text>
   </g>
   <g id="text_23">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 454.032549)" x="35.716535" y="454.032549">P02</text>
   </g>
   <g id="text_24">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 453.674659)" x="68.456693" y="453.674659">Benchmark metric and dataset review</text>
   </g>
   <g id="text_25">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 475.458119)" x="35.716535" y="475.458119">SYSTEM</text>
   </g>
   <g id="text_26">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 475.57765)">Interpret the evidence as a statistical evaluation expert. Review prevalence, threshold freezing,</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 481.210994)">calibration, paired or cluster bootstrap and homology-aware evaluation. Do not create dataset names,</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 486.844338)">URLs or computed results.</text>
   </g>
   <g id="text_27">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 507.028985)" x="35.716535" y="507.028985">USER</text>
   </g>
   <g id="text_28">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 507.089922)">Review whether the candidates form a complementary test matrix. Prefer balanced and differently</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 512.723266)">imbalanced sets only when provenance, labels, training overlap, homology and independence are</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 518.43461)">defensible. Return accept, reject or defer for every candidate.</text>
   </g>
   <g id="text_29">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 538.599851)" x="35.716535" y="538.599851">VERIFIED OUTPUT</text>
   </g>
   <g id="text_30">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 538.599851)" x="86.314961" y="538.599851">Dynamic metric protocol persisted; dataset properties without evidence marked needs_sequence_audit</text>
   </g>
   <g id="text_31">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 552.491032)" x="35.716535" y="552.491032">SOURCE</text>
   </g>
   <g id="text_32">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 552.737907)" x="86.314961" y="552.737907">agents/deepseek_meeting/metric_agent.md · deep_research_literature_agent.py:3354-3369</text>
   </g>
   <g id="text_33">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 617.148691)" x="35.716535" y="617.148691">P03</text>
   </g>
   <g id="text_34">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 616.882207)" x="68.456693" y="616.882207">Critic audit and Chief memory update</text>
   </g>
   <g id="text_35">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 638.574261)" x="35.716535" y="638.574261">SYSTEM</text>
   </g>
   <g id="text_36">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 638.635198)">Audit scope, provenance, reproducibility, leakage and unsupported certainty. The Chief must reconcile</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 644.268542)">proposals, criticisms, rebuttals and dissent while preserving the cumulative candidate pool and</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 649.979886)">explicit reasons for any downgrade.</text>
   </g>
   <g id="text_37">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 670.145127)" x="35.716535" y="670.145127">USER</text>
   </g>
   <g id="text_38">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 670.20372)">Adjudicate every dataset and model coverage candidate, check continuity with prior memory, then write</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 675.919064)">strict JSON for the long-term state. Historical memory is an evidence anchor rather than a fixed</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 681.552408)">recommendation template.</text>
   </g>
   <g id="text_39">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 701.715993)" x="35.716535" y="701.715993">VERIFIED OUTPUT</text>
   </g>
   <g id="text_40">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 701.77693)" x="86.314961" y="701.77693">literature_deep_research_memory.json/.md and screening decision CSV refreshed</text>
   </g>
   <g id="text_41">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 715.607174)" x="35.716535" y="715.607174">SOURCE</text>
   </g>
   <g id="text_42">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 715.854049)" x="86.314961" y="715.854049">agents/deepseek_meeting/critic_agent.md · chief_agent.md · deep_research_literature_agent.py:3374-3474</text>
   </g>
   <g id="text_43">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 35.716535, 812.875482)" x="35.716535" y="812.875482">Core clauses are faithful, space-limited renderings of the project prompts; runtime payload values are abbreviated, never substituted.</text>
   </g>
   <g id="text_44">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:end;" transform="rotate(-0, 559.559055, 812.87431)" x="559.559055" y="812.87431">01 / 05</text>
   </g>
  </g>
