   <g id="text_1">
    <text style="fill:#315b77;font-family:Arial;font-size:5.4px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 41.750258)" x="35.716535" y="41.750258">AUDITABLE AGENT PROMPTS · PART III</text>
   </g>
   <g id="text_2">
    <text style="fill:#111c2e;font-family:Arial;font-size:13.6px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 70.516438)" x="35.716535" y="70.516438">Dataset alignment, execution and scientific evaluation</text>
   </g>
   <g id="text_3">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 127.800266)" x="35.716535" y="127.800266">P08</text>
   </g>
   <g id="text_4">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 127.533781)" x="68.456693" y="127.533781">Observed-output schema extraction</text>
   </g>
   <g id="text_5">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 149.225835)" x="35.716535" y="149.225835">SYSTEM</text>
   </g>
   <g id="text_6">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 149.345367)">Infer id, sequence and probability fields only from visible output headers and samples. Never invent a</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 155.06071)">column. If an identifier or prediction field cannot be established, return UNKNOWN and request human</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 160.63546)">intervention.</text>
   </g>
   <g id="text_7">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 180.796702)" x="35.716535" y="180.796702">USER</text>
   </g>
   <g id="text_8">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 180.857639)">Read the Stage-1 exploration report and return the exact seven-key schema for every model: file_path,</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 186.572983)">file_ext, sep, comment_char, id_col, seq_col and prob_col. Output JSON only.</text>
   </g>
   <g id="text_9">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 203.527725)" x="35.716535" y="203.527725">VERIFIED OUTPUT</text>
   </g>
   <g id="text_10">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 203.591788)" x="86.314961" y="203.591788">Observed schemas are persisted and reused through schema_memory.json</text>
   </g>
   <g id="text_11">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 217.418906)" x="35.716535" y="217.418906">SOURCE</text>
   </g>
   <g id="text_12">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 217.665781)" x="86.314961" y="217.665781">agents/runtime_prompts/data_analyst_extraction.md · run_meeting.py:330-331</text>
   </g>
   <g id="text_13">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 290.916407)" x="35.716535" y="290.916407">P09</text>
   </g>
   <g id="text_14">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 290.558517)" x="68.456693" y="290.558517">Evaluation code generation and review</text>
   </g>
   <g id="text_15">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 312.341977)" x="35.716535" y="312.341977">SYSTEM</text>
   </g>
   <g id="text_16">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 312.402915)">Use only runtime-supplied model commands, dataset files, schemas and output contracts. Do not invent</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 318.036258)">paths, dependency versions, model outputs, columns or metric values. Preserve missing predictions as</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 323.669602)">missing.</text>
   </g>
   <g id="text_17">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 343.912843)" x="35.716535" y="343.912843">USER</text>
   </g>
   <g id="text_18">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 344.032375)">Generate one executable Python evaluation script and one launch script. A separate Data Architect</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 349.743718)">reviews every referenced field; runtime code performs syntax, artifact, dependency, path and scientific</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 355.377062)">metric validation.</text>
   </g>
   <g id="text_19">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 375.483709)" x="35.716535" y="375.483709">VERIFIED OUTPUT</text>
   </g>
   <g id="text_20">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 375.544647)" x="86.314961" y="375.544647">Automatic HPC predictions and manual prediction tables converge at one evaluator</text>
   </g>
   <g id="text_21">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 389.374891)" x="35.716535" y="389.374891">SOURCE</text>
   </g>
   <g id="text_22">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 389.621766)" x="86.314961" y="389.621766">agents/runtime_prompts/coder.md · data_analyst_review.md · main.py · run_meeting.py</text>
   </g>
   <g id="text_23">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 454.032549)" x="35.716535" y="454.032549">P10</text>
   </g>
   <g id="text_24">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 453.674659)" x="68.456693" y="453.674659">Manual prediction import contract</text>
   </g>
   <g id="text_25">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 475.458119)" x="35.716535" y="475.458119">SYSTEM</text>
   </g>
   <g id="text_26">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 475.57765)">Manual model outputs cannot bypass provenance or metric rules. Preserve the original file, align</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 481.210994)">sequence IDs, labels and probabilities, and report duplicate, unmatched or invalid rows.</text>
   </g>
   <g id="text_27">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 498.189142)" x="35.716535" y="498.189142">USER</text>
   </g>
   <g id="text_28">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 498.191486)">Import the three supplied prediction tables into dataset-specific directories, standardize their schema</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 503.844236)">and continue from the same scientific evaluator used by automatically executed models.</text>
   </g>
   <g id="text_29">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 520.920166)" x="35.716535" y="520.920166">VERIFIED OUTPUT</text>
   </g>
   <g id="text_30">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 520.981104)" x="86.314961" y="520.981104">C_AMPs-predict test n=59,311 · Veltri test n=1,203 · ProteoGPT test n=1,796</text>
   </g>
   <g id="text_31">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 534.811347)" x="35.716535" y="534.811347">SOURCE</text>
   </g>
   <g id="text_32">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 535.058222)" x="86.314961" y="535.058222">import_manual_prediction_results.py · data/manual_predictions/ · data/results_manual/</text>
   </g>
   <g id="text_33">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 617.148691)" x="35.716535" y="617.148691">P11</text>
   </g>
   <g id="text_34">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 616.882207)" x="68.456693" y="616.882207">Independent scientific result audit</text>
   </g>
   <g id="text_35">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 638.574261)" x="35.716535" y="638.574261">SYSTEM</text>
   </g>
   <g id="text_36">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 638.635198)">Interpret objective benchmark data without fabricating missing results. Distinguish execution failure</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 644.346542)">from biological prediction performance and keep dataset-specific limitations visible.</text>
   </g>
   <g id="text_37">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 661.305284)" x="35.716535" y="661.305284">USER</text>
   </g>
   <g id="text_38">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 661.366222)">Review dynamic metric weights, real metric tables and quantitative scores. Explain performance under</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 667.077565)">the meeting protocol, then write the model-level scientific judgement and evidence-limited ranking.</text>
   </g>
   <g id="text_39">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 684.036308)" x="35.716535" y="684.036308">VERIFIED OUTPUT</text>
   </g>
   <g id="text_40">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 684.097245)" x="86.314961" y="684.097245">Three evaluation bundles produced for 18 usable models</text>
   </g>
   <g id="text_41">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 697.927489)" x="35.716535" y="697.927489">SOURCE</text>
   </g>
   <g id="text_42">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 698.174364)" x="86.314961" y="698.174364">agents/runtime_prompts/critic.md · scientific_evaluation.py · data/results_manual/*/eval_result.json</text>
   </g>
   <g id="text_43">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 35.716535, 812.875482)" x="35.716535" y="812.875482">Core clauses are faithful, space-limited renderings of the project prompts; runtime payload values are abbreviated, never substituted.</text>
   </g>
   <g id="text_44">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:end;" transform="rotate(-0, 559.559055, 812.87431)" x="559.559055" y="812.87431">03 / 05</text>
   </g>
  </g>
 </g>
