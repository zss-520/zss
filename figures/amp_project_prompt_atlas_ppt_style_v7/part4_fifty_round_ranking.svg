   <g id="text_1">
    <text style="fill:#315b77;font-family:Arial;font-size:5.4px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 41.750258)" x="35.716535" y="41.750258">AUDITABLE AGENT PROMPTS · PART IV</text>
   </g>
   <g id="text_2">
    <text style="fill:#111c2e;font-family:Arial;font-size:13.6px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 70.391063)" x="35.716535" y="70.391063">Blinded 50-round metric weighting and model ranking</text>
   </g>
   <g id="text_3">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 127.800266)" x="35.716535" y="127.800266">P12</text>
   </g>
   <g id="text_4">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 127.442375)" x="68.456693" y="127.442375">Independent specialist weight proposals</text>
   </g>
   <g id="text_5">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 149.225835)" x="35.716535" y="149.225835">SYSTEM</text>
   </g>
   <g id="text_6">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 149.286773)">You are one role in a blinded multi-Agent meeting selecting metric weights for AMP binary</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 154.998117)">classification. Never optimize weights for a named model, a desired Top-3 or a leaderboard position.</text>
   </g>
   <g id="text_7">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 171.956859)" x="35.716535" y="171.956859">USER</text>
   </g>
   <g id="text_8">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 172.07639)">Literature, Statistics and Screening Agents independently propose all eligible metric weights from</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 177.787734)">literature consensus, anonymous dataset profiles and metric-level evidence. Distinguish literature,</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 183.421078)">benchmark evidence and LLM prior.</text>
   </g>
   <g id="text_9">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 203.527725)" x="35.716535" y="203.527725">VERIFIED OUTPUT</text>
   </g>
   <g id="text_10">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 203.588663)" x="86.314961" y="203.588663">Three role-specific proposal streams retained for the initial meeting and every round</text>
   </g>
   <g id="text_11">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 217.418906)" x="35.716535" y="217.418906">SOURCE</text>
   </g>
   <g id="text_12">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 217.665781)" x="86.314961" y="217.665781">agents/weight_meeting/shared_system.md · literature_agent.md · statistics_agent.md · screening_agent.md</text>
   </g>
   <g id="text_13">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 290.916407)" x="35.716535" y="290.916407">P13</text>
   </g>
   <g id="text_14">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 290.558517)" x="68.456693" y="290.558517">Independent methodology audit</text>
   </g>
   <g id="text_15">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 312.341977)" x="35.716535" y="312.341977">SYSTEM</text>
   </g>
   <g id="text_16">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 312.402915)">Audit unsupported evidence, hidden model preference, test-set tuning, excessive metric dominance,</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 318.114258)">redundancy, ignored calibration, prevalence and unresolved disagreement. Do not produce final weights.</text>
   </g>
   <g id="text_17">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 335.073001)" x="35.716535" y="335.073001">USER</text>
   </g>
   <g id="text_18">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 335.133938)">Review all three blinded proposals and return criticisms, required changes, preferred metric</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 340.849282)">directions, a leakage check and unresolved risks in strict JSON.</text>
   </g>
   <g id="text_19">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 357.804024)" x="35.716535" y="357.804024">VERIFIED OUTPUT</text>
   </g>
   <g id="text_20">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 357.804024)" x="86.314961" y="357.804024">reviewer_agent_audit.json plus per-round Reviewer records preserved</text>
   </g>
   <g id="text_21">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 371.695205)" x="35.716535" y="371.695205">SOURCE</text>
   </g>
   <g id="text_22">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 371.94208)" x="86.314961" y="371.94208">agents/weight_meeting/reviewer_agent.md · llm_agent_weight_meeting.py:457-470</text>
   </g>
   <g id="text_23">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 454.032549)" x="35.716535" y="454.032549">P14</text>
   </g>
   <g id="text_24">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 453.674659)" x="68.456693" y="453.674659">Chief bounded consensus</text>
   </g>
   <g id="text_25">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 475.458119)" x="35.716535" y="475.458119">SYSTEM</text>
   </g>
   <g id="text_26">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 475.458119)">Reconcile the expert proposals and Reviewer audit into the only accepted weight vector. Respond to</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 481.091463)">criticisms and preserve disagreement and uncertainty.</text>
   </g>
   <g id="text_27">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 498.189142)" x="35.716535" y="498.189142">USER</text>
   </g>
   <g id="text_28">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 498.308674)">Return all exact metric keys with weights in [0.005, 0.35], sum=1, no model-specific priority and at</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 504.020017)">most 0.30 L1 change from the previous accepted vector. Runtime code validates and repairs schema</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 509.653361)">violations.</text>
   </g>
   <g id="text_29">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 529.760009)" x="35.716535" y="529.760009">VERIFIED OUTPUT</text>
   </g>
   <g id="text_30">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 529.820946)" x="86.314961" y="529.820946">chief_initial_decision.json and round_001.json through round_050.json</text>
   </g>
   <g id="text_31">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 543.65119)" x="35.716535" y="543.65119">SOURCE</text>
   </g>
   <g id="text_32">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 543.898065)" x="86.314961" y="543.898065">agents/weight_meeting/chief_agent.md · llm_agent_weight_meeting.py:473-497</text>
   </g>
   <g id="text_33">
    <text style="fill:#17698d;font-family:Arial;font-size:8px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 617.148691)" x="35.716535" y="617.148691">P15</text>
   </g>
   <g id="text_34">
    <text style="fill:#111c2e;font-family:Arial;font-size:7.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 68.456693, 616.882207)" x="68.456693" y="616.882207">Fifty-round evidence aggregation</text>
   </g>
   <g id="text_35">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 638.574261)" x="35.716535" y="638.574261">SYSTEM</text>
   </g>
   <g id="text_36">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 638.574261)">The accepted vector scores every eligible model against the same normalized metric evidence. Model</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 644.285604)">identities remain absent from weight-setting prompts, and the complete audit trail is retained.</text>
   </g>
   <g id="text_37">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 661.305284)" x="35.716535" y="661.305284">USER</text>
   </g>
   <g id="text_38">
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 661.366222)">Repeat bounded evidence updates for 50 rounds, calculate each model's weighted score, then aggregate</text>
    <text style="fill:#111c2e;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 667.081565)">median score, IQR, median rank and Top-3 frequency without a model-specific bonus.</text>
   </g>
   <g id="text_39">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 684.036308)" x="35.716535" y="684.036308">VERIFIED OUTPUT</text>
   </g>
   <g id="text_40">
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 684.155839)">50 rounds · 600 weight rows · 900 model-round scores · Top-3: pepnet_standard / amplify_imb /</text>
    <text style="fill:#16844a;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;" transform="translate(86.314961 689.867183)">C_AMPs-predict</text>
   </g>
   <g id="text_41">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 35.716535, 706.767331)" x="35.716535" y="706.767331">SOURCE</text>
   </g>
   <g id="text_42">
    <text style="fill:#617184;font-family:DejaVu Sans Mono;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 86.314961, 707.014206)" x="86.314961" y="707.014206">codex_agent_weight_meeting.py · iterative_weight_meeting.py · data/results_manual/codex_agent_weight_meeting/</text>
   </g>
   <g id="text_43">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 35.716535, 812.875482)" x="35.716535" y="812.875482">Core clauses are faithful, space-limited renderings of the project prompts; runtime payload values are abbreviated, never substituted.</text>
   </g>
   <g id="text_44">
    <text style="fill:#617184;font-family:Arial;font-size:5px;font-style:normal;font-weight:normal;text-anchor:end;" transform="rotate(-0, 559.559055, 812.87431)" x="559.559055" y="812.87431">04 / 05</text>
   </g>
  </g>
