name: automated-tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install numpy pandas scikit-learn paramiko python-dotenv requests
      - name: Compile workflow modules
        run: python -m py_compile benchmark_portfolio.py workflow_guards.py run_manifest.py scientific_evaluation.py workflow_utils.py amp_benchmark_menu.py main.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
